<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub - Claudegame</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
        }
        header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7, #ff2d95);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        header p {
            color: #888;
            font-size: 1.1rem;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            width: 100%;
        }
        .game-card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 2rem;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(123, 47, 247, 0.3);
            border-color: #7b2ff7;
        }
        .game-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .game-card h2 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .game-card p {
            color: #999;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .game-tag {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.25rem 0.75rem;
            background: rgba(123, 47, 247, 0.2);
            border: 1px solid rgba(123, 47, 247, 0.4);
            border-radius: 20px;
            font-size: 0.8rem;
            color: #b388ff;
        }
        footer {
            margin-top: auto;
            padding: 2rem;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Claudegame</h1>
        <p>A collection of browser-based games</p>
    </header>
    <div class="games-grid">
        <a href="games/dungeon-crawler/index.html" class="game-card">
            <div class="game-icon">&#x1F5E1;</div>
            <h2>Dungeon Crawler</h2>
            <p>Explore procedurally generated dungeons, battle monsters, collect loot, and descend deeper into the darkness. How far can you go?</p>
            <span class="game-tag">Roguelike</span>
        </a>
    </div>
    <footer>
        Claudegame &mdash; Built with Claude
    </footer>
</body>
</html>
